<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'LBC Collector' }}</title>
  <style>
    :root{
      --bg:#0f172a; /* slate-900 */
      --panel:#111827ee; /* gray-900 */
      --muted:#94a3b8; /* slate-400 */
      --text:#e5e7eb;  /* gray-200 */
      --brand:#22c55e; /* green-500 */
      --brand-2:#06b6d4; /* cyan-500 */
      --accent:#f59e0b; /* amber-500 */
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu; background:radial-gradient(1200px 600px at 20% -10%,#0ea5e980,transparent), radial-gradient(1200px 600px at 120% 20%,#22c55e60,transparent), var(--bg); color:var(--text); min-height:100vh}
    a{color:inherit;text-decoration:none}
    header.nav{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(8px); background: #0b1221cc; border-bottom:1px solid #1f2937;
    }
    .container{max-width:1100px;margin:0 auto;padding:1rem}
    .brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
    .brand .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--brand-2)); box-shadow:0 0 20px var(--brand-2)}
    nav a{padding:.5rem .8rem;border-radius:8px;color:var(--muted);transition:all .2s}
    nav a:hover{color:var(--text); background:#1f2937}
    .grid{display:grid;gap:1rem}
    .cards{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .card{background:linear-gradient(180deg,#0b1221,#0b1221e6); border:1px solid #1f2937; border-radius:14px; padding:1rem; box-shadow: 0 10px 30px #00000040; transition:transform .2s, box-shadow .2s}
    .card:hover{transform:translateY(-2px); box-shadow:0 18px 35px #00000060}
    .muted{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border:1px solid #2c3a50;background:#0e182a;border-radius:10px;color:#e2e8f0;cursor:pointer;transition:all .2s}
    .btn:hover{border-color:#334155;background:#0f213b}
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#001014; border:none}
    .btn.primary:hover{filter:brightness(1.05)}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{border-bottom:1px solid #243040;padding:.6rem;text-align:left}
    .pill{display:inline-block;padding:.15rem .5rem;border-radius:999px;border:1px solid #334155; color:#cbd5e1}
    .ok{color:#34d399}
    .fail{color:#f87171}
    .fade-in{animation: fade-in .35s ease both}
    @keyframes fade-in {from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
    .footer{color:var(--muted);font-size:.85rem;margin:2rem 0}
    input,select{background:#0b1221;color:#e5e7eb;border:1px solid #253245;border-radius:10px;padding:.5rem .7rem}
    .controls{display:flex;flex-wrap:wrap;gap:.6rem}
  </style>
</head>
<body>
  <header class="nav">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:1rem">
      <div class="brand"><span class="dot"></span> <span>LBC Collector</span></div>
      <nav style="display:flex;gap:.25rem">
        <a href="/">Dashboard</a>
        <a href="/ads">Annonces</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
    <div class="footer muted">© {{ (now() if now else '') or '' }} — Interface légère avec animations</div>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
