version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cars_collector_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cars_collector
      MYSQL_USER: collector
      MYSQL_PASSWORD: collectorpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Pipeline/mysql_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - collector_network

  pipeline:
    build:
      context: ./Pipeline
      dockerfile: Dockerfile
    container_name: cars_collector_pipeline
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=collector
      - DB_PASSWORD=collectorpass
      - DB_NAME=cars_collector
      - USE_MYSQL=true
    ports:
      - "8000:8000"
    volumes:
      - ./Pipeline/config.ini:/app/config.ini
      - ./Pipeline/local_cache.db:/app/local_cache.db
      - ./Pipeline/files:/app/files
    networks:
      - collector_network
    command: uvicorn web_app:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./WEB
      dockerfile: Dockerfile
    container_name: cars_collector_web
    depends_on:
      - pipeline
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://pipeline:8000
      # Add your environment variables here
      - DATABASE_URL=mysql://collector:collectorpass@mysql:3306/cars_collector
      # - NEXTAUTH_URL=http://localhost:3000
      # - NEXTAUTH_SECRET=your-secret-here
    ports:
      - "3000:3000"
    networks:
      - collector_network

volumes:
  mysql_data:

networks:
  collector_network:
    driver: bridge
